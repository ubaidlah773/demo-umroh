<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="bg-Wedding" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#272838"/>
      <stop offset="100%" stop-color="#1E1F2C"/>
    </linearGradient>
    <linearGradient id="lavenderAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7D6B91"/>
      <stop offset="100%" stop-color="#989FCE"/>
    </linearGradient>
  </defs>

  <!-- Deep Background -->
  <rect width="1200" height="800" fill="url(#bg-Wedding)"/>

  <!-- Subtle Decorative Grid Lines -->
  <g stroke="rgba(152,159,206,0.06)" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="0" y1="640" x2="1200" y2="640"/>
    <line x1="0" y1="720" x2="1200" y2="720"/>
    <line x1="100" y1="0" x2="100" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="800"/>
    <line x1="300" y1="0" x2="300" y2="800"/>
    <line x1="400" y1="0" x2="400" y2="800"/>
    <line x1="500" y1="0" x2="500" y2="800"/>
    <line x1="600" y1="0" x2="600" y2="800"/>
    <line x1="700" y1="0" x2="700" y2="800"/>
    <line x1="800" y1="0" x2="800" y2="800"/>
    <line x1="900" y1="0" x2="900" y2="800"/>
    <line x1="1000" y1="0" x2="1000" y2="800"/>
    <line x1="1100" y1="0" x2="1100" y2="800"/>
  </g>

  <!-- Browser Frame -->
  <rect x="70" y="60" width="1060" height="680" rx="16" fill="#1F202E" stroke="#7D6B91" stroke-opacity="0.3" stroke-width="1.5"/>

  <!-- Top Title Bar -->
  <rect x="70" y="60" width="1060" height="54" rx="16" fill="#2E2C40"/>
  <circle cx="106" cy="87" r="6" fill="#EF4444"/>
  <circle cx="128" cy="87" r="6" fill="#F59E0B"/>
  <circle cx="150" cy="87" r="6" fill="#10B981"/>
  
  <rect x="180" y="74" width="460" height="26" rx="6" fill="#1F202E" stroke="#7D6B91" stroke-opacity="0.25"/>
  <text x="195" y="91" fill="#989FCE" font-family="monospace" font-size="12">https://undangan.me/the-wedding • Interactive Wedding Invitation</text>
  
  <rect x="940" y="74" width="160" height="26" rx="6" fill="rgba(52,127,196,0.2)" stroke="#347FC4" stroke-opacity="0.5"/>
  <text x="1020" y="91" fill="#347FC4" font-family="monospace" font-size="11" font-weight="bold" text-anchor="middle">WEB EXPERIENCE</text>

  <!-- Header Banner Inside -->
  <rect x="105" y="140" width="990" height="115" rx="12" fill="#272838" stroke="#7D6B91" stroke-opacity="0.25"/>
  <text x="135" y="185" fill="#F7F8FC" font-family="system-ui, sans-serif" font-weight="bold" font-size="28">Undangan Online — Interactive Wedding Storytelling</text>
  <text x="135" y="218" fill="#989FCE" font-family="system-ui, sans-serif" font-size="15">Animasi Pembukaan, Visual Storytelling, Galeri Foto Momen Bahagia &amp; Rangkaian Acara</text>
  
  <rect x="850" y="165" width="215" height="34" rx="8" fill="rgba(152,159,206,0.15)" stroke="#989FCE" stroke-opacity="0.3"/>
  <text x="957" y="187" fill="#989FCE" font-family="monospace" font-size="12" text-anchor="middle" font-weight="bold">Animation &amp; UI</text>

  <!-- Main Grid Content -->
  <!-- Left Side: Interactive Invitation Layout & Mobile Frame -->
  <rect x="105" y="280" width="630" height="425" rx="12" fill="#252636" stroke="#7D6B91" stroke-opacity="0.25"/>
  
  <!-- Interactive Navigation Bar -->
  <rect x="130" y="305" width="580" height="44" rx="8" fill="#2E2C40"/>
  <text x="150" y="332" fill="#989FCE" font-family="monospace" font-size="13" font-weight="bold">&gt; Seksi: Sampul Buka | Kisah Mempelai | Jadwal Acara | Galeri Foto</text>

  <!-- Mobile Frame Representation in Center Left -->
  <rect x="130" y="365" width="250" height="320" rx="14" fill="#1A1B28" stroke="#7D6B91" stroke-opacity="0.35"/>
  <rect x="180" y="375" width="150" height="12" rx="6" fill="#2E2C40"/>
  
  <!-- Invitation Cover Card inside phone -->
  <rect x="145" y="398" width="220" height="95" rx="8" fill="#252636" stroke="#989FCE" stroke-opacity="0.2"/>
  <text x="255" y="426" fill="#989FCE" font-family="serif" font-style="italic" font-size="13" text-anchor="middle">The Wedding Celebration</text>
  <text x="255" y="450" fill="#F7F8FC" font-family="serif" font-weight="bold" font-size="18" text-anchor="middle">Romeo &amp; Juliet</text>
  <text x="255" y="472" fill="#347FC4" font-family="monospace" font-size="11" text-anchor="middle">Sabtu, 14 Februari 2026</text>

  <!-- Envelope Open Button -->
  <rect x="175" y="505" width="160" height="34" rx="8" fill="#347FC4"/>
  <text x="255" y="527" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle">Buka Undangan</text>

  <!-- Photo Thumbnails inside phone -->
  <g fill="#2E2C40">
    <rect x="145" y="555" width="65" height="50" rx="4"/>
    <rect x="222" y="555" width="65" height="50" rx="4"/>
    <rect x="300" y="555" width="65" height="50" rx="4"/>
  </g>
  <text x="255" y="630" fill="#989FCE" font-family="monospace" font-size="10" text-anchor="middle">Smooth Scroll &amp; Animations</text>
  <rect x="230" y="665" width="50" height="4" rx="2" fill="#7D6B91" opacity="0.6"/>

  <!-- Event Details on the Middle Right -->
  <rect x="400" y="365" width="310" height="150" rx="8" fill="#1C1D2A" stroke="#7D6B91" stroke-opacity="0.2"/>
  <text x="420" y="395" fill="#347FC4" font-family="monospace" font-size="12" font-weight="bold">RANGKAIAN ACARA:</text>
  <text x="420" y="425" fill="#F7F8FC" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Akad Nikah: 08:00 – 10:00 WIB</text>
  <text x="420" y="448" fill="#989FCE" font-family="system-ui, sans-serif" font-size="12">Masjid Agung Kota • Khidmat &amp; Sakral</text>
  <text x="420" y="480" fill="#F7F8FC" font-family="system-ui, sans-serif" font-weight="bold" font-size="14">Resepsi: 11:00 – 14:00 WIB</text>
  <text x="420" y="503" fill="#989FCE" font-family="system-ui, sans-serif" font-size="12">Grand Ballroom • Ramah Tamah Tamu</text>

  <rect x="400" y="530" width="310" height="155" rx="8" fill="#1C1D2A" stroke="#7D6B91" stroke-opacity="0.2"/>
  <text x="420" y="560" fill="#989FCE" font-family="monospace" font-size="12" font-weight="bold">FITUR INTERAKTIF:</text>
  <text x="420" y="588" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Animasi transisi &amp; envelope reveal</text>
  <text x="420" y="614" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Lightbox galeri momen prewedding</text>
  <text x="420" y="640" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Countdown hari H &amp; integrasi maps</text>
  <text x="420" y="666" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Desain disesuaikan tema mempelai</text>

  <!-- Right Side Column -->
  <rect x="760" y="280" width="335" height="425" rx="12" fill="#252636" stroke="#7D6B91" stroke-opacity="0.25"/>
  
  <rect x="785" y="305" width="285" height="40" rx="8" fill="#2E2C40"/>
  <text x="805" y="330" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="13" font-weight="bold">Spesifikasi Arsitektur Web</text>

  <rect x="785" y="360" width="285" height="150" rx="8" fill="#1C1D2A" stroke="#7D6B91" stroke-opacity="0.2"/>
  <text x="805" y="388" fill="#347FC4" font-family="monospace" font-size="12" font-weight="bold">EXPERIENCE HIGHLIGHTS:</text>
  <text x="805" y="415" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Visual storytelling mendalam</text>
  <text x="805" y="442" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Animasi pembuka dinamis</text>
  <text x="805" y="469" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Layout fleksibel multi-resolusi</text>
  <text x="805" y="496" fill="#F7F8FC" font-family="system-ui, sans-serif" font-size="12">• Responsive mobile-first feel</text>

  <rect x="785" y="525" width="285" height="155" rx="8" fill="#1C1D2A" stroke="#7D6B91" stroke-opacity="0.2"/>
  <text x="805" y="555" fill="#347FC4" font-family="monospace" font-size="12" font-weight="bold">TEKNOLOGI PENYUSUN:</text>
  <rect x="805" y="567" width="245" height="22" rx="5" fill="#2E2C40"/>
  <text x="927" y="582" fill="#989FCE" font-family="monospace" font-size="10.5" text-anchor="middle">HTML5 Semantic</text>
  <rect x="805" y="593" width="245" height="22" rx="5" fill="#2E2C40"/>
  <text x="927" y="608" fill="#989FCE" font-family="monospace" font-size="10.5" text-anchor="middle">CSS3 Keyframes &amp; Flexbox</text>
  <rect x="805" y="619" width="245" height="22" rx="5" fill="#2E2C40"/>
  <text x="927" y="634" fill="#989FCE" font-family="monospace" font-size="10.5" text-anchor="middle">JavaScript Interactivity</text>
  <rect x="805" y="645" width="245" height="22" rx="5" fill="#2E2C40"/>
  <text x="927" y="660" fill="#989FCE" font-family="monospace" font-size="10.5" text-anchor="middle">Responsive Design</text>
</svg>

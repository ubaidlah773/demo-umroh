  <text x="180" y="90" fill="#64748B" font-family="monospace" font-size="12">coffeeshop-experience • Modern Web Application</text>
  
  <!-- Header Banner -->
  <rect x="90" y="140" width="1020" height="110" rx="12" fill="#131A29" stroke="rgba(255,255,255,0.06)"/>

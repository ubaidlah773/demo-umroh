  <rect x="120" y="535" width="610" height="70" rx="8" fill="#0C101A" stroke="rgba(255,255,255,0.04)"/>
  <text x="140" y="575" fill="#E2E8F0" font-family="sans-serif" font-size="14">Component 03: JavaScript Dynamic Cart &amp; Category Filter</text>
  <rect x="120" y="620" width="610" height="65" rx="8" fill="#0C101A" stroke="rgba(255,255,255,0.04)"/>
  <text x="140" y="660" fill="#E2E8F0" font-family="sans-serif" font-size="14">Component 04: Mobile First Responsive Layout &amp; Touch Navigation</text>


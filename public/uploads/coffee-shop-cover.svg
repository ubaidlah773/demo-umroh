  <rect x="785" y="275" width="325" height="430" rx="12" fill="#131A29" stroke="rgba(255,255,255,0.06)"/>
  <text x="815" y="315" fill="#F8FAFC" font-family="sans-serif" font-weight="bold" font-size="16">Architecture Status</text>
  <rect x="815" y="340" width="265" height="75" rx="8" fill="#182236"/>
  <text x="835" y="370" fill="#94A3B8" font-family="monospace" font-size="11">CORE MARKUP</text>
  <text x="835" y="395" fill="#347FC4" font-family="sans-serif" font-weight="bold" font-size="15">Semantic HTML5</text>
  <rect x="815" y="430" width="265" height="75" rx="8" fill="#182236"/>
  <text x="835" y="460" fill="#94A3B8" font-family="monospace" font-size="11">STYLING SYSTEM</text>
  <text x="835" y="485" fill="#10B981" font-family="sans-serif" font-weight="bold" font-size="15">CSS3 • Flex &amp; Grid</text>
  <rect x="815" y="520" width="265" height="75" rx="8" fill="#182236"/>
  <text x="835" y="550" fill="#94A3B8" font-family="monospace" font-size="11">INTERACTION LOGIC</text>
